<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="navy-grad-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sky-grad-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="#ffffff" />
  
  <!-- Outer glowing subtle ring -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#f1f5f9" stroke-width="8" />

  <g transform="translate(10, -10)">
    <!-- Left Wing (Navy Blue) -->
    <g fill="url(#navy-grad-s)" transform="translate(40, 160) scale(1.4)">
      <path d="M 110 90 C 80 50, 40 45, 10 50 C 40 65, 70 80, 110 90 Z" opacity="0.95" />
      <path d="M 110 92 C 75 62, 35 60, 15 70 C 42 80, 72 90, 110 92 Z" opacity="0.85" />
      <path d="M 108 95 C 70 72, 30 75, 20 88 C 45 92, 72 96, 108 95 Z" opacity="0.75" />
      <path d="M 104 98 C 65 85, 35 95, 30 105 C 50 104, 75 102, 104 98 Z" opacity="0.65" />
    </g>

    <!-- Stylized Central Letter 'B' -->
    <g transform="translate(256, 275)" text-anchor="middle">
      <text x="0" y="0" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="190" fill="#0f172a" letter-spacing="-4">B</text>
    </g>

    <!-- Right Wing (Sky Blue) -->
    <g fill="url(#sky-grad-s)" transform="translate(460, 160) scale(-1.4, 1.4) translate(-110, 0)">
      <path d="M 110 90 C 80 50, 40 45, 10 50 C 40 65, 70 80, 110 90 Z" opacity="0.95" />
      <path d="M 110 92 C 75 62, 35 60, 15 70 C 42 80, 72 90, 110 92 Z" opacity="0.85" />
      <path d="M 108 95 C 70 72, 30 75, 20 88 C 45 92, 72 96, 108 95 Z" opacity="0.75" />
      <path d="M 104 98 C 65 85, 35 95, 30 105 C 50 104, 75 102, 104 98 Z" opacity="0.65" />
    </g>
  </g>
</svg>
